<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Cosmo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #002e6d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a8bbd6;
      margin-bottom: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
    }

    .score-box {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
    }

    .score-box p {
      font-size: 0.7rem;
      color: #a8bbd6;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .score-box span {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
    }

    canvas {
      border: 4px solid #ffffff;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }

    .controls {
      margin-top: 1rem;
      text-align: center;
    }

    .controls p {
      font-size: 0.85rem;
      color: #a8bbd6;
      margin-bottom: 0.5rem;
    }

    button {
      background: #ffffff;
      color: #002e6d;
      border: none;
      padding: 0.6rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    button:hover { background: #e0e8f5; }

    .back-link {
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .back-link a {
      color: #a8bbd6;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Flappy Cosmo</h1>
  <p class="subtitle">BYU Cougars</p>

  <div class="scoreboard">
    <div class="score-box">
      <p>Score</p>
      <span id="score">0</span>
    </div>
    <div class="score-box">
      <p>Best</p>
      <span id="best">0</span>
    </div>
  </div>

  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <div class="controls">
    <p>Press Space, click, or tap to flap!</p>
    <button onclick="startGame()">START GAME</button>
  </div>

  <div class="back-link">
    <a href="FromScratch.html">&larr; Back to BYU Cougars</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;
    const GRAVITY = 0.25;
    const FLAP = -7;
    const PIPE_W = 60;
    const PIPE_GAP = 180;
    const PIPE_SPEED = 2;
    const BIRD_R = 22;

    let bird, pipes, score, best, gameState, animId, countdown, countdownTimer;
    best = 0;

    function initGame() {
      bird = { x: 80, y: H / 2, vy: 0 };
      pipes = [];
      score = 0;
      gameState = 'waiting';
      updateScore();
      draw();
    }

    function startGame() {
      if (animId) cancelAnimationFrame(animId);
      if (countdownTimer) clearInterval(countdownTimer);
      bird = { x: 80, y: H / 2, vy: -4 };
      pipes = [];
      score = 0;
      gameState = 'countdown';
      countdown = 3;
      updateScore();
      draw();

      countdownTimer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          gameState = 'playing';
          loop();
        }
        draw();
      }, 1000);
    }

    function flap() {
      if (gameState === 'playing') {
        bird.vy = FLAP;
      } else if (gameState === 'dead') {
        startGame();
      }
    }

    function spawnPipe() {
      const minY = 80;
      const maxY = H - 100 - PIPE_GAP;
      const topH = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
      pipes.push({ x: W, topH, scored: false });
    }

    function update() {
      bird.vy += GRAVITY;
      bird.y += bird.vy;

      if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 240) {
        spawnPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;

        if (pipes[i].x + PIPE_W < 0) {
          pipes.splice(i, 1);
          continue;
        }

        if (!pipes[i].scored && pipes[i].x + PIPE_W < bird.x) {
          pipes[i].scored = true;
          score++;
          updateScore();
        }

        const birdLeft = bird.x - BIRD_R + 6;
        const birdRight = bird.x + BIRD_R - 6;
        const birdTop = bird.y - BIRD_R + 6;
        const birdBottom = bird.y + BIRD_R - 6;

        if (birdRight > pipes[i].x && birdLeft < pipes[i].x + PIPE_W) {
          if (birdTop < pipes[i].topH || birdBottom > pipes[i].topH + PIPE_GAP) {
            die();
            return;
          }
        }
      }

      if (bird.y + BIRD_R > H - 40 || bird.y - BIRD_R < 0) {
        die();
      }
    }

    function die() {
      gameState = 'dead';
      if (score > best) best = score;
      document.getElementById('best').textContent = best;
      draw();
    }

    function drawBackground() {
      ctx.fillStyle = '#5ba3e0';
      ctx.fillRect(0, 0, W, H - 60);

      ctx.fillStyle = '#ffffff';
      drawCloud(50, 70, 40);
      drawCloud(190, 45, 35);
      drawCloud(310, 85, 45);
    }

    function drawCloud(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.arc(x + r * 0.8, y - r * 0.3, r * 0.7, 0, Math.PI * 2);
      ctx.arc(x + r * 1.5, y, r * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGround() {
      ctx.fillStyle = '#4a7c2f';
      ctx.fillRect(0, H - 60, W, 30);
      ctx.fillStyle = '#2d5a1a';
      ctx.fillRect(0, H - 30, W, 30);

      ctx.fillStyle = '#3d6b27';
      for (let x = 0; x < W; x += 20) {
        ctx.fillRect(x, H - 62, 10, 4);
      }
    }

    function drawPipes() {
      pipes.forEach(p => {
        ctx.fillStyle = '#001a3f';
        ctx.fillRect(p.x, 0, PIPE_W, p.topH);
        ctx.fillRect(p.x, p.topH + PIPE_GAP, PIPE_W, H - p.topH - PIPE_GAP);

        ctx.fillStyle = '#002e6d';
        ctx.fillRect(p.x - 6, p.topH - 22, PIPE_W + 12, 22);
        ctx.fillRect(p.x - 6, p.topH + PIPE_GAP, PIPE_W + 12, 22);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(p.x + 8, 0, 10, p.topH);
        ctx.fillRect(p.x + 8, p.topH + PIPE_GAP, 10, H);
      });
    }

    function drawCosmo() {
      const x = bird.x;
      const y = bird.y;
      const angle = Math.min(Math.max(bird.vy * 0.07, -0.5), 1.0);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.fillStyle = '#c8a96e';
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#a0855a';
      ctx.beginPath();
      ctx.arc(-6, -8, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(6, -8, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#c8a96e';
      ctx.beginPath();
      ctx.arc(-6, -9, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(6, -9, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#002e6d';
      ctx.beginPath();
      ctx.arc(0, -2, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 8px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('BYU', 0, -2);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-5, 4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, 4, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(-5, 4, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, 4, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff9999';
      ctx.beginPath();
      ctx.arc(0, 10, 5, 0, Math.PI);
      ctx.fill();

      ctx.fillStyle = '#ff6666';
      ctx.beginPath();
      ctx.moveTo(BIRD_R - 2, -3);
      ctx.lineTo(BIRD_R + 10, 0);
      ctx.lineTo(BIRD_R - 2, 3);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 38px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 60);

      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 16px Arial';
      ctx.fillText('FINAL SCORE', W / 2, H / 2 - 20);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px Arial';
      ctx.fillText(score, W / 2, H / 2 + 30);

      ctx.font = '16px Arial';
      ctx.fillStyle = '#a8bbd6';
      ctx.fillText('Best: ' + best, W / 2, H / 2 + 60);

      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 15px Arial';
      ctx.fillText('Click or Space to retry', W / 2, H / 2 + 100);
    }

    function drawCountdown() {
      ctx.fillStyle = 'rgba(0,46,109,0.6)';
      ctx.fillRect(W / 2 - 60, H / 2 - 60, 120, 110);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 70px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(countdown, W / 2, H / 2 + 20);

      ctx.font = 'bold 14px Arial';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText('GET READY!', W / 2, H / 2 - 30);
    }

    function drawStart() {
      ctx.fillStyle = 'rgba(0,46,109,0.75)';
      ctx.fillRect(W / 2 - 150, H / 2 - 45, 300, 90);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Help Cosmo fly!', W / 2, H / 2 - 10);
      ctx.fillStyle = '#ffcc00';
      ctx.font = '14px Arial';
      ctx.fillText('Press START to begin', W / 2, H / 2 + 20);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawPipes();
      drawGround();
      drawCosmo();

      if (gameState === 'dead') drawGameOver();
      if (gameState === 'waiting') drawStart();
      if (gameState === 'countdown') drawCountdown();
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = best;
    }

    function loop() {
      if (gameState !== 'playing') return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); flap(); }
    });
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

    initGame();
  </script>

</body>
</html>
